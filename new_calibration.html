      tbody tr:nth-child(even) { background: var(--row-alt); }

      function renderPivot(tableId, tsv) {
        const host = document.getElementById(tableId);
        if (!host) return;
        host.innerHTML = '';

        const lines = tsv.trim().split(/\n+/);
        const header = lines.shift().split('\t');
        const rows = lines.map(line => {
          const [split, metric, coverage_pct, k, accuracy_pct, risk_pct] = line.split('\t');
          return {
            split,
            metric,
            coverage_pct: Number(coverage_pct),
            k: Number(k),
            accuracy_pct,
            risk_pct
          };
        });

        const metrics = Array.from(new Set(rows.map(r => r.metric)));
        const coverageLevels = Array.from(new Set(rows.map(r => r.coverage_pct))).sort((a, b) => a - b);
        const splits = ['base', 'plus'].filter(split => rows.some(r => r.split === split));

        const thead = document.createElement('thead');
        const row1 = document.createElement('tr');
        const thCov = document.createElement('th');
        thCov.textContent = 'coverage_pct';
        thCov.rowSpan = 2;
        row1.appendChild(thCov);
        const thSplit = document.createElement('th');
        thSplit.textContent = 'split';
        thSplit.rowSpan = 2;
        row1.appendChild(thSplit);
        const thK = document.createElement('th');
        thK.textContent = 'k';
        thK.className = 'number';
        thK.rowSpan = 2;
        row1.appendChild(thK);
        metrics.forEach(metric => {
          const th = document.createElement('th');
          th.textContent = metric.replace(/_/g, ' ');
          th.colSpan = 2;
          row1.appendChild(th);
        });
        thead.appendChild(row1);

        const row2 = document.createElement('tr');
        metrics.forEach(() => {
          const thAcc = document.createElement('th');
          thAcc.textContent = 'accuracy%';
          row2.appendChild(thAcc);
          const thRisk = document.createElement('th');
          thRisk.textContent = 'risk%';
          row2.appendChild(thRisk);
        });
        thead.appendChild(row2);

        const tbody = document.createElement('tbody');
        coverageLevels.forEach(cov => {
          splits.forEach((split, idx) => {
            const tr = document.createElement('tr');
            if (idx === splits.length - 1) tr.classList.add('cov-sep');

            if (idx === 0) {
              const tdCov = document.createElement('td');
              tdCov.textContent = cov;
              tdCov.rowSpan = splits.length;
              tdCov.className = 'text';
              tr.appendChild(tdCov);
            }

            const tdSplit = document.createElement('td');
            tdSplit.textContent = split.charAt(0).toUpperCase() + split.slice(1);
            tdSplit.className = 'text';
            tr.appendChild(tdSplit);

            const matchForK = rows.find(r => r.coverage_pct === cov && r.split === split);
            const tdK = document.createElement('td');
            tdK.textContent = matchForK ? matchForK.k : '';
            tr.appendChild(tdK);

            metrics.forEach(metric => {
              const rec = rows.find(r => r.coverage_pct === cov && r.split === split && r.metric === metric) || { accuracy_pct: '', risk_pct: '' };
              const tdAcc = document.createElement('td');
              tdAcc.textContent = rec.accuracy_pct;
              tr.appendChild(tdAcc);
              const tdRisk = document.createElement('td');
              tdRisk.textContent = rec.risk_pct;
              tr.appendChild(tdRisk);
            });

            tbody.appendChild(tr);
          });
        });

        host.appendChild(thead);
        host.appendChild(tbody);
      }

      DATASETS.forEach(ds => renderPivot(ds.id, ds.data));
    </script>
