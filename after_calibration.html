    <script>
      (function buildTable() {
        const payload = JSON.parse(document.getElementById('raw-data').textContent);
        const rows = payload.rows;
        const header = payload.header;

        const metricKeys = header.slice(3);
        const metrics = [];
        const calibrationsSet = new Set();
        metricKeys.forEach(key => {
          const match = key.match(/(.+?)__([^_]+)_(acc|risk)_pct$/i);
          if (!match) return;
          const metric = match[1];
          const calib = match[2].toUpperCase();
          if (!metrics.includes(metric)) metrics.push(metric);
          calibrationsSet.add(calib);
        });

        const calibrations = Array.from(calibrationsSet).sort((a, b) => {
          if (a === 'PLATT') return -1;
          if (b === 'PLATT') return 1;
          return a.localeCompare(b);
        });
        const table = document.getElementById('calibration');
        const thead = document.createElement('thead');
        const top = document.createElement('tr');
        ['coverage_pct', 'split', 'k'].forEach((label, idx) => {
          const th = document.createElement('th');
          th.textContent = label;
          th.classList.add('frozen');
          if (idx === 0) th.classList.add('coverage');
          if (idx === 1) th.classList.add('split');
          if (idx === 2) th.classList.add('k');
          th.rowSpan = 3;
          th.style.textTransform = 'none';
          top.appendChild(th);
        });
        metrics.forEach(metric => {
          const th = document.createElement('th');
          th.textContent = metric.replace(/_/g, ' ');
          th.colSpan = calibrations.length * 2;
          top.appendChild(th);
        });
        thead.appendChild(top);

        const mid = document.createElement('tr');
        metrics.forEach(metric => {
          calibrations.forEach(calib => {
            const th = document.createElement('th');
            th.textContent = calib;
            th.colSpan = 2;
            mid.appendChild(th);
          });
        });
        thead.appendChild(mid);

        const bottom = document.createElement('tr');
        metrics.forEach(() => {
          calibrations.forEach(() => {
            ['accuracy%', 'risk%'].forEach(label => {
              const th = document.createElement('th');
              th.textContent = label;
              bottom.appendChild(th);
            });
          });
        });
        thead.appendChild(bottom);

        table.appendChild(thead);

        const coverageValues = [...new Set(rows.map(r => r.coverage_pct))].sort((a, b) => a - b);
        const splits = ['base', 'plus'];
        const tbody = document.createElement('tbody');

        function getValue(row, metric, calib, type) {
          const key = `${metric}__${calib}_${type}_pct`;
          return row[key] ?? '';
        }

        coverageValues.forEach(cov => {
          splits.forEach((split, idx) => {
            const row = rows.find(r => r.coverage_pct === cov && r.split === split);
            if (!row) return;
            const tr = document.createElement('tr');
            if (idx === splits.length - 1) tr.classList.add('cov-sep');

            if (idx === 0) {
              const tdCov = document.createElement('td');
              tdCov.textContent = cov;
              tdCov.rowSpan = splits.length;
              tdCov.classList.add('frozen', 'coverage');
              tr.appendChild(tdCov);
            }

            const tdSplit = document.createElement('td');
            tdSplit.textContent = split === 'base' ? 'Base' : 'Plus';
            tdSplit.classList.add('frozen', 'split');
            tr.appendChild(tdSplit);

            const tdK = document.createElement('td');
            tdK.textContent = row.k;
            tdK.classList.add('number', 'frozen', 'k');
            tr.appendChild(tdK);

        metrics.forEach(metric => {
          calibrations.forEach(calib => {
            ['acc', 'risk'].forEach(kind => {
              const td = document.createElement('td');
              td.textContent = getValue(row, metric, calib, kind);
              td.classList.add('number');
              tr.appendChild(td);
            });
          });
        });

            tbody.appendChild(tr);
          });
        });

        table.appendChild(tbody);
      })();
    </script>

    <script>
      (function buildTableMBPP() {
        const payload = JSON.parse(document.getElementById('raw-data-mbpp').textContent);
        const rows = payload.rows;
        const header = payload.header;

        const metricKeys = header.slice(3);
        const metrics = [];
        const calibrationsSet = new Set();
        metricKeys.forEach(key => {
          const match = key.match(/(.+?)__([^_]+)_(acc|risk)_pct$/i);
          if (!match) return;
          const metric = match[1];
          const calib = match[2].toUpperCase();
          if (!metrics.includes(metric)) metrics.push(metric);
          calibrationsSet.add(calib);
        });

        const calibrations = Array.from(calibrationsSet).sort((a, b) => {
          if (a === 'PLATT') return -1;
          if (b === 'PLATT') return 1;
          return a.localeCompare(b);
        });
        const table = document.getElementById('calibration-mbpp');
        const thead = document.createElement('thead');
        const top = document.createElement('tr');
        ['coverage_pct', 'split', 'k'].forEach((label, idx) => {
          const th = document.createElement('th');
          th.textContent = label;
          th.classList.add('frozen');
          if (idx === 0) th.classList.add('coverage');
          if (idx === 1) th.classList.add('split');
          if (idx === 2) th.classList.add('k');
          th.rowSpan = 3;
          th.style.textTransform = 'none';
          top.appendChild(th);
        });
        metrics.forEach(metric => {
          const th = document.createElement('th');
          th.textContent = metric.replace(/_/g, ' ');
          th.colSpan = calibrations.length * 2;
          top.appendChild(th);
        });
        thead.appendChild(top);

        const mid = document.createElement('tr');
        metrics.forEach(metric => {
          calibrations.forEach(calib => {
            const th = document.createElement('th');
            th.textContent = calib;
            th.colSpan = 2;
            mid.appendChild(th);
          });
        });
        thead.appendChild(mid);

        const bottom = document.createElement('tr');
        metrics.forEach(() => {
          calibrations.forEach(() => {
            ['accuracy%', 'risk%'].forEach(label => {
              const th = document.createElement('th');
              th.textContent = label;
              bottom.appendChild(th);
            });
          });
        });
        thead.appendChild(bottom);

        table.appendChild(thead);

        const coverageValues = [...new Set(rows.map(r => r.coverage_pct))].sort((a, b) => a - b);
        const splits = ['base', 'plus'];
        const tbody = document.createElement('tbody');

        function getValue(row, metric, calib, type) {
          const key = `${metric}__${calib}_${type}_pct`;
          return row[key] ?? '';
        }

        coverageValues.forEach(cov => {
          splits.forEach((split, idx) => {
            const row = rows.find(r => r.coverage_pct === cov && r.split === split);
            if (!row) return;
            const tr = document.createElement('tr');
            if (idx === splits.length - 1) tr.classList.add('cov-sep');

            if (idx === 0) {
              const tdCov = document.createElement('td');
              tdCov.textContent = cov;
              tdCov.rowSpan = splits.length;
              tdCov.classList.add('frozen', 'coverage');
              tr.appendChild(tdCov);
            }

            const tdSplit = document.createElement('td');
            tdSplit.textContent = split === 'base' ? 'Base' : 'Plus';
            tdSplit.classList.add('frozen', 'split');
            tr.appendChild(tdSplit);

            const tdK = document.createElement('td');
            tdK.textContent = row.k;
            tdK.classList.add('number', 'frozen', 'k');
            tr.appendChild(tdK);

            metrics.forEach(metric => {
              calibrations.forEach(calib => {
                ['acc', 'risk'].forEach(kind => {
                  const td = document.createElement('td');
                  td.textContent = getValue(row, metric, calib, kind);
                  td.classList.add('number');
                  tr.appendChild(td);
                });
              });
            });

            tbody.appendChild(tr);
          });
        });

        table.appendChild(tbody);
      })();
    </script>

    <script>
      (function buildTableDeepseekHE() {
        const payload = JSON.parse(document.getElementById('raw-data-deepseek-he').textContent);
        const rows = payload.rows;
        const header = payload.header;

        const metricKeys = header.slice(3);
        const metrics = [];
        const calibrationsSet = new Set();
        metricKeys.forEach(key => {
          const match = key.match(/(.+?)__([^_]+)_(acc|risk)_pct$/i);
          if (!match) return;
          const metric = match[1];
          const calib = match[2].toUpperCase();
          if (!metrics.includes(metric)) metrics.push(metric);
          calibrationsSet.add(calib);
        });

        const calibrations = Array.from(calibrationsSet).sort((a, b) => {
          if (a === 'PLATT') return -1;
          if (b === 'PLATT') return 1;
          return a.localeCompare(b);
        });
        const table = document.getElementById('calibration-deepseek-he');
        const thead = document.createElement('thead');
        const top = document.createElement('tr');
        ['coverage_pct', 'split', 'k'].forEach((label, idx) => {
          const th = document.createElement('th');
          th.textContent = label;
          th.classList.add('frozen');
          if (idx === 0) th.classList.add('coverage');
          if (idx === 1) th.classList.add('split');
          if (idx === 2) th.classList.add('k');
          th.rowSpan = 3;
          th.style.textTransform = 'none';
          top.appendChild(th);
        });
        metrics.forEach(metric => {
          const th = document.createElement('th');
          th.textContent = metric.replace(/_/g, ' ');
          th.colSpan = calibrations.length * 2;
          top.appendChild(th);
        });
        thead.appendChild(top);

        const mid = document.createElement('tr');
        metrics.forEach(metric => {
          calibrations.forEach(calib => {
            const th = document.createElement('th');
            th.textContent = calib;
            th.colSpan = 2;
            mid.appendChild(th);
          });
        });
        thead.appendChild(mid);

        const bottom = document.createElement('tr');
        metrics.forEach(() => {
          calibrations.forEach(() => {
            ['accuracy%', 'risk%'].forEach(label => {
              const th = document.createElement('th');
              th.textContent = label;
              bottom.appendChild(th);
            });
          });
        });
        thead.appendChild(bottom);

        table.appendChild(thead);

        const coverageValues = [...new Set(rows.map(r => r.coverage_pct))].sort((a, b) => a - b);
        const splits = ['base', 'plus'];
        const tbody = document.createElement('tbody');

        function getValue(row, metric, calib, type) {
          const key = `${metric}__${calib}_${type}_pct`;
          return row[key] ?? '';
        }

        coverageValues.forEach(cov => {
          splits.forEach((split, idx) => {
            const row = rows.find(r => r.coverage_pct === cov && r.split === split);
            if (!row) return;
            const tr = document.createElement('tr');
            if (idx === splits.length - 1) tr.classList.add('cov-sep');

            if (idx === 0) {
              const tdCov = document.createElement('td');
              tdCov.textContent = cov;
              tdCov.rowSpan = splits.length;
              tdCov.classList.add('frozen', 'coverage');
              tr.appendChild(tdCov);
            }

            const tdSplit = document.createElement('td');
            tdSplit.textContent = split === 'base' ? 'Base' : 'Plus';
            tdSplit.classList.add('frozen', 'split');
            tr.appendChild(tdSplit);

            const tdK = document.createElement('td');
            tdK.textContent = row.k;
            tdK.classList.add('number', 'frozen', 'k');
            tr.appendChild(tdK);

            metrics.forEach(metric => {
              calibrations.forEach(calib => {
                ['acc', 'risk'].forEach(kind => {
                  const td = document.createElement('td');
                  td.textContent = getValue(row, metric, calib, kind);
                  td.classList.add('number');
                  tr.appendChild(td);
                });
              });
            });

            tbody.appendChild(tr);
          });
        });

        table.appendChild(tbody);
      })();
    </script>

    <script>
      (function buildTableDeepseekMBPP() {
        const payload = JSON.parse(document.getElementById('raw-data-deepseek-mbpp').textContent);
        const rows = payload.rows;
        const header = payload.header;

        const metricKeys = header.slice(3);
        const metrics = [];
        const calibrationsSet = new Set();
        metricKeys.forEach(key => {
          const match = key.match(/(.+?)__([^_]+)_(acc|risk)_pct$/i);
          if (!match) return;
          const metric = match[1];
          const calib = match[2].toUpperCase();
          if (!metrics.includes(metric)) metrics.push(metric);
          calibrationsSet.add(calib);
        });

        const calibrations = Array.from(calibrationsSet).sort((a, b) => {
          if (a === 'PLATT') return -1;
          if (b === 'PLATT') return 1;
          return a.localeCompare(b);
        });
        const table = document.getElementById('calibration-deepseek-mbpp');
        const thead = document.createElement('thead');
        const top = document.createElement('tr');
        ['coverage_pct', 'split', 'k'].forEach((label, idx) => {
          const th = document.createElement('th');
          th.textContent = label;
          th.classList.add('frozen');
          if (idx === 0) th.classList.add('coverage');
          if (idx === 1) th.classList.add('split');
          if (idx === 2) th.classList.add('k');
          th.rowSpan = 3;
          th.style.textTransform = 'none';
          top.appendChild(th);
        });
        metrics.forEach(metric => {
          const th = document.createElement('th');
          th.textContent = metric.replace(/_/g, ' ');
          th.colSpan = calibrations.length * 2;
          top.appendChild(th);
        });
        thead.appendChild(top);

        const mid = document.createElement('tr');
        metrics.forEach(metric => {
          calibrations.forEach(calib => {
            const th = document.createElement('th');
            th.textContent = calib;
            th.colSpan = 2;
            mid.appendChild(th);
          });
        });
        thead.appendChild(mid);

        const bottom = document.createElement('tr');
        metrics.forEach(() => {
          calibrations.forEach(() => {
            ['accuracy%', 'risk%'].forEach(label => {
              const th = document.createElement('th');
              th.textContent = label;
              bottom.appendChild(th);
            });
          });
        });
        thead.appendChild(bottom);

        table.appendChild(thead);

        const coverageValues = [...new Set(rows.map(r => r.coverage_pct))].sort((a, b) => a - b);
        const splits = ['base', 'plus'];
        const tbody = document.createElement('tbody');

        function getValue(row, metric, calib, type) {
          const key = `${metric}__${calib}_${type}_pct`;
          return row[key] ?? '';
        }

        coverageValues.forEach(cov => {
          splits.forEach((split, idx) => {
            const row = rows.find(r => r.coverage_pct === cov && r.split === split);
            if (!row) return;
            const tr = document.createElement('tr');
            if (idx === splits.length - 1) tr.classList.add('cov-sep');

            if (idx === 0) {
              const tdCov = document.createElement('td');
              tdCov.textContent = cov;
              tdCov.rowSpan = splits.length;
              tdCov.classList.add('frozen', 'coverage');
              tr.appendChild(tdCov);
            }

            const tdSplit = document.createElement('td');
            tdSplit.textContent = split === 'base' ? 'Base' : 'Plus';
            tdSplit.classList.add('frozen', 'split');
            tr.appendChild(tdSplit);

            const tdK = document.createElement('td');
            tdK.textContent = row.k;
            tdK.classList.add('number', 'frozen', 'k');
            tr.appendChild(tdK);

            metrics.forEach(metric => {
              calibrations.forEach(calib => {
                ['acc', 'risk'].forEach(kind => {
                  const td = document.createElement('td');
                  td.textContent = getValue(row, metric, calib, kind);
                  td.classList.add('number');
                  tr.appendChild(td);
                });
              });
            });

            tbody.appendChild(tr);
          });
        });

        table.appendChild(tbody);
      })();
    </script>
